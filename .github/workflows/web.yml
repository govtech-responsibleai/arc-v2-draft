name: web

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: ARCvisor web app tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck --workspace arcvisor
      - name: Test (the rules come from arc-core; the register from arc-risk-register/)
        run: npm test --workspace arcvisor
      - name: Build
        run: npm run build --workspace arcvisor
